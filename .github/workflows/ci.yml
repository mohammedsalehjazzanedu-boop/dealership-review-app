name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 server --max-line-length=120 --exclude=migrations,venv,node_modules,frontend || true

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint
        run: |
          cd server/frontend
          npm install eslint --no-save

      - name: Run ESLint
        run: |
          cd server/frontend
          npx eslint src --ext .js,.jsx --no-eslintrc --env browser,es2021 --parser-options=ecmaVersion:2021,sourceType:module,ecmaFeatures:{jsx:true} || true